<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
<title id="title">Oracle adaptive workspace: focus and recovery</title><desc id="desc">Original Oracle UI illustrations informed by Emil Kowalski design guidance. A narrow inventory screen preserves item identity, warehouse and quantities with larger controls. A desktop editor retains list selection, shows focus on the reorder threshold, and keeps the draft after a failed save with retry and cancel actions. Synthetic data; static examples.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#20362b" flood-opacity="0.04"/><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#20362b" flood-opacity="0.05"/></filter></defs>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.num{font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1120" height="850" rx="16" fill="#f6f7f5" />
<text x="32" y="56" font-size="32" fill="#202526" font-weight="650" text-anchor="start" letter-spacing="-0.8">Same task. A different amount of room.</text>
<text x="32" y="85" font-size="15" fill="#606a6d" font-weight="400" text-anchor="start" >Preserve context, show focus, and help someone recover without losing their work.</text>
<text x="32" y="135" font-size="12" fill="#606a6d" font-weight="600" text-anchor="start" letter-spacing="1">01 / FOCUSED REVIEW</text>
<text x="376" y="135" font-size="12" fill="#606a6d" font-weight="600" text-anchor="start" letter-spacing="1">02 / EDIT WITHOUT LOSING CONTEXT</text>
