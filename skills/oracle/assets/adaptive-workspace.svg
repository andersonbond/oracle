<text x="612" y="441" font-size="12" fill="#606a6d" font-weight="400" text-anchor="start" >Alerts appear when stock falls below this value.</text>
<text x="612" y="479" font-size="13" fill="#202526" font-weight="550" text-anchor="start" >Note</text>
<rect x="612" y="491" width="452" height="62" rx="7" fill="white" stroke="#899590" />
<text x="626" y="517" font-size="15" fill="#202526" font-weight="400" text-anchor="start" >Review the next shipment.</text>
<rect x="612" y="573" width="452" height="57" rx="7" fill="#fff3f0" />
<circle cx="630" cy="591" r="7" fill="none" stroke="#b42318"/>
<text x="630" y="595" font-size="10" fill="#b42318" font-weight="600" text-anchor="middle" >!</text>
<text x="646" y="595" font-size="13" fill="#a3261e" font-weight="550" text-anchor="start" >Couldn’t save your changes.</text>
<text x="646" y="616" font-size="12" fill="#943d32" font-weight="400" text-anchor="start" >Your draft is kept. Try again when connected.</text>
<rect x="612" y="650" width="118" height="40" rx="7" fill="#176b52" stroke="#176b52" />
