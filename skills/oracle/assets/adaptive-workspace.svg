<rect x="742" y="650" width="86" height="40" rx="7" fill="white" stroke="#899590" />
<text x="785.0" y="675.0" font-size="14" fill="#202526" font-weight="550" text-anchor="middle" >Cancel</text>
<text x="1064" y="676" font-size="12" fill="#606a6d" font-weight="400" text-anchor="end" >Unsaved changes</text>
<text x="32" y="778" font-size="16" fill="#202526" font-weight="600" text-anchor="start" >Adapt the view, keep the meaning</text>
<text x="32" y="803" font-size="13" fill="#606a6d" font-weight="400" text-anchor="start" >Larger controls and essential values stay within reach.</text>
<text x="612" y="778" font-size="16" fill="#202526" font-weight="600" text-anchor="start" >Make recovery part of the design</text>
<text x="612" y="803" font-size="13" fill="#606a6d" font-weight="400" text-anchor="start" >The selected record, focused field, and draft stay visible.</text>
<text x="32" y="835" font-size="12" fill="#606a6d" font-weight="400" text-anchor="start" >Original Oracle illustrations · synthetic data · preserve a comparison view when columns must be seen together</text>
</svg>
