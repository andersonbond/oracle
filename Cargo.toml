[package]
name = "oracle-guide"
version = "1.0.6"
edition = "2024"
rust-version = "1.85"
description = "An engineering guide for vibe coders and their coding agents"
license = "MIT"
repository = "https://github.com/andersonbond/oracle"
readme = "README.md"
include = ["src/**", "tests/**", "skills/**", "examples/**", "REFERENCE.md", "assets/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CONTRIBUTING.md", "SECURITY.md", "CHANGELOG.md", "oracle.toml"]

[[bin]]
name = "oracle"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
toml = "=0.8.23"
walkdir = "=2.5.0"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
strip = true
