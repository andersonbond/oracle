name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      containers:
        description: Build and test container and Redis examples on native Linux x64 and ARM64
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  containers:
    if: github.event_name == 'workflow_dispatch' && inputs.containers
    name: Containers / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and exercise final image and Compose recipe
        run: python3 tests/container_smoke.py
      - name: Exercise Rust and Redis caching with outage and restart
        run: python3 skills/oracle/assets/caching/verify.py

  verify:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: stable
          - os: ubuntu-latest
            rust: 1.85.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt --component clippy
          rustup default ${{ matrix.rust }}
      - name: Formatting
        if: matrix.rust == 'stable'
        run: cargo fmt --all --check
      - name: Lint
        if: matrix.rust == 'stable'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Behavioral tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Upload binary on manual builds
        if: github.event_name == 'workflow_dispatch' && matrix.rust == 'stable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oracle-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/oracle
            target/release/oracle.exe
          if-no-files-found: error
          retention-days: 7
